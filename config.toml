# skipcast configuration.
#
# Every tunable lives in this file. Nothing that changes the shape of the
# output should be hardcoded in the Python.
#
# Resolution order: --config <path>, then ./config.toml, then
# ~/.config/skipcast/config.toml, then the built-in defaults in config.py.

[paths]
# Where downloads, cut files, and the database live. Relative to this file.
data_dir = "data"

[fetch]
# `skipcast analyze <url>` and `skipcast fetch <url>` pull audio with yt-dlp.
# Downloads land in data_dir/source_dir.
source_dir = "sources"

# yt-dlp format selector. bestaudio avoids pulling video streams we discard.
format = "bestaudio/best"

# Keep the file exactly as delivered next to the transcoded MP3, so a bad
# transcode can be redone without hitting the network again.
keep_original = true

[diarize]
# Gated model. Accept the terms at huggingface.co/pyannote/speaker-diarization-3.1
# and huggingface.co/pyannote/segmentation-3.0, then export HF_TOKEN.
pipeline = "pyannote/speaker-diarization-3.1"

# "auto" picks mps on Apple Silicon and falls back to cpu. Set to "cpu" if
# mps produces garbage or crashes; it is slower but always correct.
device = "auto"

# Leave at 0 to let the pipeline decide how many speakers there are.
# Setting num_speakers overrides min/max. Useful when you know a show is
# always the same two hosts plus one guest.
num_speakers = 0
min_speakers = 0
max_speakers = 0

# Diarization runs on a decoded 16 kHz mono WAV, never on the source MP3.
sample_rate = 16000

[identity]
# Phase 1. Cosine similarity above which a diarized cluster is considered
# the same person as a stored speaker profile.
match_threshold = 0.70

[cut]
# Phase 2. Segment-selection rules.

# Adjacent segments from the same speaker separated by less than this many
# seconds are merged into one region before any other rule is applied.
merge_gap_seconds = 1.5

# A region belonging to a skipped speaker is only cut if it is at least this
# long. Short interjections stay in. Cutting every "yeah" and "mhm" produces
# unlistenable audio.
min_skip_seconds = 15.0

# Each cut boundary is moved inward by this much so the cut does not clip the
# first or last syllable of the speaker being kept.
boundary_padding_seconds = 0.25

# Crossfade applied at each join between surviving pieces.
crossfade_seconds = 0.15

# When two cut regions end up back to back, the only thing between them is
# their own inward padding. That padding exists to protect a kept speaker, and
# between two cuts there is no kept speaker — leaving it behind strands a
# fraction of a second of the removed voice between two jumps. Set false to
# keep the padding literally in that case.
merge_adjacent_cuts = true

# If the rules want to remove more than this fraction of an episode,
# something is wrong. Log a warning and skip the episode rather than emit
# garbage.
max_skip_fraction = 0.5

# Keep-only mode: naming who to keep rather than who to cut, which is what a
# person feed is built from. Both settings above are wrong for it, because it
# is asking a different question — how much of everyone else goes, rather than
# how much of one person.

# How long everyone else has to talk uninterrupted before that stretch is
# removed. Deliberately shorter than min_skip_seconds: at 15s almost nothing
# would go, since a question rarely runs that long. Short exchanges stay in on
# purpose — an answer with the question cut out is a person talking to nobody.
keep_only_min_cut_seconds = 8.0

# The equivalent ceiling. Removing 90% of an episode is the job here, not a
# symptom, so this only has to catch "kept nothing at all".
keep_only_max_skip_fraction = 0.98

[serve]
# The feed and the audio are served over Tailscale, so no auth layer.
host = "0.0.0.0"
port = 8730

# The base URL your phone will actually use. Enclosure URLs in the generated
# feed are built from this, so "localhost" works for testing on this machine
# but must become the tailnet name before AntennaPod can fetch anything —
# e.g. "http://your-machine.tailnet-name.ts.net:8730".
base_url = "http://tamass-macbook-air.tailbb9c76.ts.net:8730"

# The control panel at / lets you subscribe, poll, label speakers and set skip
# flags from a phone browser over Tailscale. There is no auth, by design —
# it is only reachable on your tailnet.
enable_ui = true

# Podcast search by name uses Apple's public directory to turn a show name into
# an RSS URL. Read-only, no account, nothing sent but the search term. Set
# false to keep skipcast entirely self-contained; pasting feed URLs still works.
enable_search = true

[poll]
# Newest N episodes considered per feed on each poll. Podcast feeds routinely
# carry hundreds of back episodes; processing them all on first subscribe
# would run for days.
max_episodes = 5

# Stop after this many failures in one run rather than grinding through a
# whole broken feed.
max_failures = 3

# Automatic polling. Every feed whose last poll is older than this gets one
# queued. Scheduling lives inside `skipcast serve` rather than in a separate
# launchd job so it goes through the same worker — two processes diarizing at
# once would fight over the GPU and the database. Set 0 to poll only by hand.
interval_hours = 6

[transcribe]
# Whisper runs locally via faster-whisper. ctranslate2 has no Metal backend, so
# this is CPU-bound on Apple Silicon — budget roughly 6-8 min per 90-min episode
# at "small", two to three times that at "medium".
enabled = true
model = "small"          # tiny | base | small | medium | large-v3
compute_type = "int8"    # int8 is much faster on CPU; float32 is marginally better
language = "en"          # empty string autodetects, at some cost in speed
beam_size = 5

[summary]
# The one part of skipcast that talks to a cloud service. Set enabled = false
# to keep everything local — you still get the searchable transcript.
enabled = true

# gemini | anthropic. Keys go in the .env file next to this one, never in
# ~/.zshrc — launchd does not read shell profiles, so the background service
# would not see them. gemini reads GEMINI_API_KEY, anthropic ANTHROPIC_API_KEY.
provider = "gemini"

# Blank uses the provider's default: gemini-3.6-flash / claude-opus-5.
# Roughly per 90-minute episode:
#   gemini-2.5-flash       ~$0.01   cheapest that is still good
#   gemini-3.6-flash       ~$0.05   current Flash, the default
#   claude-opus-5          ~$0.15   best quality, most expensive
# Gemini also has a free tier that may cover a single podcast entirely.
model = ""

# Gemini counts thinking against this budget, so it has to cover both the
# thinking and the summary itself or the summary gets cut off mid-sentence.
# It also has to cover the structured JSON block, which is requested in the
# same call — asking for it separately would mean sending the whole transcript
# twice.
max_tokens = 16000

# Gemini only: minimal | low | medium | high | default. Summarising a
# transcript is extraction rather than deep reasoning, and thinking bills at
# the output rate, so "low" is the sensible default. Raise it if summaries
# feel shallow on argument-heavy shows.
thinking = "low"

# Anthropic only; ignored by gemini.
effort = "high"          # low | medium | high | xhigh | max

# "original" summarises the whole episode including the parts cut out, so you
# can see what you skipped. "cut" summarises only what you will actually hear.
scope = "original"

[encode]
# Re-encode rather than stream-copy. See cut.py for why.
bitrate = "128k"
channels = 1
